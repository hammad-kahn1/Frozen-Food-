name: frozen_food
description: A production-ready Frozen Food D2C Delivery mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # State Management & DI
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  hydrated_bloc: ^9.1.5
  get_it: ^8.0.2
  injectable: ^2.4.4
  
  # Models & JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # Routing
  go_router: ^14.2.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  
  # Firebase Services
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.3.0
  firebase_crashlytics: ^4.1.0
  firebase_analytics: ^11.3.0
  firebase_remote_config: ^5.1.0
  firebase_app_check: ^0.3.1+4
  
  # Auth Providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  
  # Utilities & Helpers
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.0.5
  internet_connection_checker_plus: ^2.5.1
  intl: ^0.19.0
  rxdart: ^0.28.0
  dartz: ^0.10.1
  logger: ^2.4.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  shimmer: ^3.0.0
  lottie: ^3.1.2
  photo_view: ^0.15.0
  
  # External Services
  algolia_helper_flutter: ^1.3.0
  flutter_stripe: ^11.0.0
  
  # Optional extensions
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  injectable_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  
  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
