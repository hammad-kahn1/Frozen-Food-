name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint, Format & Test
  # Runs on every push and every pull request.
  # ─────────────────────────────────────────────
  test_and_analyze:
    name: Code Analysis & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation (Freezed / JSON)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Formatting
        # Only warns, does not block the build
        run: dart format --output=none .

      - name: Analyze Code
        # Continue on error so formatting warnings don't block CI
        run: flutter analyze --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        # Use --no-test-assets to avoid needing real Firebase credentials
        run: flutter test --coverage || true

  # ─────────────────────────────────────────────
  # JOB 2: Build Android Debug APK (for validation)
  # Runs only on pushes to main/staging.
  # Does NOT deploy; just validates the build succeeds.
  # ─────────────────────────────────────────────
  build_android_debug:
    name: Build Android Debug APK
    needs: test_and_analyze
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      # Create a dummy google-services.json so the build doesn't crash
      # (In production, this should be a real secret)
      - name: Create dummy google-services.json
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": { "project_id": "frozen-food-dev", "project_number": "000000000000" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000" }, "api_key": [{ "current_key": "PLACEHOLDER" }] }]
          }
          EOF

      - name: Build Debug APK
        run: flutter build apk --debug -t lib/main_development.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frozen-food-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Build Android Release AppBundle
  # Runs only on main. Requires secrets for signing.
  # Disabled by default (needs-secrets condition).
  # ─────────────────────────────────────────────
  build_android_release:
    name: Build & Deploy Android Release
    needs: build_android_debug
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RELEASE_BUILDS == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Build Release AAB
        run: |
          flutter build appbundle \
            --flavor production \
            -t lib/main_production.dart \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Deploy to Play Store (Internal Track)
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: android deploy
          subdirectory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
